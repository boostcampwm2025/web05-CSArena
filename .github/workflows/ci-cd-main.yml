name: CI/CD - Deploy to AWS ECS

on:
  push:
    branches: [develop]

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 733959200078.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPOSITORY: csarena-backend
  ECS_CLUSTER: csarena-cluster
  ECS_SERVICE: csarena-backend
  S3_BUCKET: csarena-frontend
  CF_DISTRIBUTION_ID: E3NVYGGZ2OZA8O

jobs:
  ci:
    name: Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Backend test
        run: pnpm --filter @web05-boostcamp/backend test

      - name: Backend build
        run: pnpm --filter @web05-boostcamp/backend build

      - name: Frontend build
        run: pnpm --filter @web05-boostcamp/frontend build

  deploy-backend:
    name: Deploy Backend → ECS
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image to ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/backend/Dockerfile
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Register new task definition
        id: task-def
        env:
          NEW_IMAGE: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_SERVICE }} \
            --query 'taskDefinition' \
            --output json > /tmp/td-current.json

          python3 << 'EOF'
          import json, os

          with open('/tmp/td-current.json') as f:
              td = json.load(f)

          for key in ['taskDefinitionArn', 'revision', 'status', 'requiresAttributes',
                      'compatibilities', 'registeredAt', 'registeredBy', 'enableFaultInjection']:
              td.pop(key, None)

          new_image = os.environ['NEW_IMAGE']
          for cd in td['containerDefinitions']:
              if cd.get('name') == 'csarena-backend':
                  cd['image'] = new_image
                  cd['environmentFiles'] = []

          with open('/tmp/td-new.json', 'w') as f:
              json.dump(td, f)
          EOF

          REVISION=$(aws ecs register-task-definition \
            --cli-input-json file:///tmp/td-new.json \
            --query 'taskDefinition.revision' \
            --output text)
          echo "revision=$REVISION" >> "$GITHUB_OUTPUT"

      - name: Update ECS service and wait for stability
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition ${{ env.ECS_SERVICE }}:${{ steps.task-def.outputs.revision }} \
            --force-new-deployment

          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}

  deploy-frontend:
    name: Deploy Frontend → S3 + CloudFront
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @web05-boostcamp/frontend build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync packages/frontend/dist/ s3://${{ env.S3_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CF_DISTRIBUTION_ID }} \
            --paths "/*"
